<!DOCTYPE html>
<html>
<head>
    <title>Installation Progress</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #1a1a1a; line-height: 1.6; height: 100vh; overflow: hidden; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        h1 { font-size: 2.2rem; font-weight: 300; margin-bottom: 8px; color: #1a1a1a; }
        .subtitle { color: #656d76; margin-bottom: 32px; font-size: 1rem; }

        .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
        .btn { background: white; border: 1px solid #e1e5e9; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; text-decoration: none; color: #1a1a1a; }
        .btn:hover { background: #f8f9fa; border-color: #d0d7de; }
        .btn-primary { background: #0969da; color: white; border-color: #0969da; }
        .btn-primary:hover { background: #0860ca; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .checkbox-wrapper input { margin: 0; }
        .logs-container { background: #ffffff; border: 1px solid #f0f0f0; border-radius: 16px; padding: 24px; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
        #logs { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 8px; }
        .log-entry { padding: 16px 0; border-bottom: 1px solid #f8f9fa; display: flex; align-items: flex-start; gap: 16px; }
        .log-entry:last-child { border-bottom: none; }
        .log-entry:hover { background: #f8f9fa; margin: 0 -24px 0 -24px; padding-left: 24px; padding-right: 32px; border-radius: 8px; }
        .status-circle { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
        .status-circle.starting { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .status-circle.running { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
        .status-circle.success { background: linear-gradient(135deg, #34d399, #10b981); }
        .status-circle.error { background: linear-gradient(135deg, #f87171, #ef4444); }
        .status-circle.info { background: linear-gradient(135deg, #22d3ee, #06b6d4); }
        .log-content { flex: 1; }
        .log-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .app-name { color: #1f2937; font-weight: 600; font-size: 0.95rem; }
        .status-pill { font-size: 0.7rem; text-transform: uppercase; font-weight: 500; padding: 2px 8px; border-radius: 12px; letter-spacing: 0.5px; }
        .status-pill.starting { background: #fef3c7; color: #d97706; }
        .status-pill.running { background: #dbeafe; color: #2563eb; }
        .status-pill.success { background: #d1fae5; color: #059669; }
        .status-pill.error { background: #fee2e2; color: #dc2626; }
        .status-pill.info { background: #cffafe; color: #0891b2; }
        .timestamp { color: #9ca3af; font-size: 0.8rem; font-family: 'SF Mono', Monaco, monospace; margin-left: auto; }
        .log-message { color: #6b7280; font-size: 0.9rem; line-height: 1.5; }
        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .empty-state-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Installation Progress</h1>
        <p class="subtitle">Monitor your software installation in real-time</p>
        
        
        <div class="controls">
            <button onclick="refreshLogs()" class="btn">Refresh Logs</button>
            <a href="/" class="btn">Back to Selection</a>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Auto-refresh</label>
            </div>
        </div>
        
        <div class="logs-container">
            <div id="logs">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>No installation logs yet. Waiting for installation to begin...</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        let autoRefreshInterval;
        const sessionId = "{{SESSION_ID}}";
        async function refreshLogs() {
            try {
                const response = await fetch(`/api/sessions/${sessionId}/logs`);
                const data = await response.json();
                const logsContainer = document.getElementById('logs');
                if (data.logs && data.logs.length > 0) {
                    // Check if user is at or near the bottom before updating
                    const isAtBottom = logsContainer.scrollTop >= logsContainer.scrollHeight - logsContainer.clientHeight - 50;
                    
                    logsContainer.innerHTML = data.logs.map(log => `
                        <div class="log-entry">
                            <div class="status-circle ${log.status}"></div>
                            <div class="log-content">
                                <div class="log-header">
                                    <span class="app-name">${log.app}</span>
                                    <span class="status-pill ${log.status}">${log.status}</span>
                                    <span class="timestamp">${log.time}</span>
                                </div>
                                <div class="log-message">${log.message}</div>
                            </div>
                        </div>
                    `).join('');
                    
                    // Only auto-scroll if user was at the bottom
                    if (isAtBottom) {
                        logsContainer.scrollTop = logsContainer.scrollHeight;
                    }
                }
            } catch (error) {
                console.error('Failed to refresh logs:', error);
            }
        }
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(refreshLogs, 3000);
            } else {
                clearInterval(autoRefreshInterval);
            }
        }
        // Initialize page        
        toggleAutoRefresh();
        refreshLogs();
    </script>
</body>
</html>
